<!DOCTYPE html>
<html lang = "zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content = "width=device-width, initial-scale=1">
<title>我的笔记助手</title>
<style>
  .steps { margin-bottom: 8px; }
  .step { font-size: 12px; color: #8a8a82; padding: 3px 0; }
  .step + .step { border-top: 1px dashed #f0f0ea; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    max-width: 780px; margin: 0 auto; height: 100vh;
    display: flex; flex-direction: column;
    background: #f7f7f5; color: #1a1a1a;
  }
  header {
    padding: 14px 20px; background: #fff; border-bottom: 1px solid #e5e5e0;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .3px; }
  header button {
    font-size: 13px; padding: 6px 14px; border: 1px solid #d5d5d0;
    background: #fff; border-radius: 20px; cursor: pointer; color: #555;
  }
  header button:hover { background: #f0f0ec; }

  #log { flex: 1; overflow-y: auto; padding: 24px 20px 8px; }
  .row { display: flex; margin-bottom: 18px; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 11px 15px; border-radius: 14px;
    line-height: 1.65; font-size: 15px; white-space: pre-wrap; word-break: break-word;
  }
  .user .bubble { background: #2f6f4f; color: #fff; border-bottom-right-radius: 4px; }
  .ai   .bubble { background: #fff; border: 1px solid #e8e8e3; border-bottom-left-radius: 4px; }

  .meta { margin-top: 8px; font-size: 12px; color: #8a8a82; }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    background: #eef3ee; color: #4a6b52; margin-right: 6px; font-size: 12px;
  }
  .tag.plain { background: #f0f0ec; color: #777; }

  #bar {
    display: flex; gap: 10px; padding: 14px 20px 20px;
    background: #fff; border-top: 1px solid #e5e5e0;
  }
  #msg {
    flex: 1; resize: none; height: 46px; padding: 12px 14px; font-size: 15px;
    border: 1px solid #dcdcd6; border-radius: 12px; font-family: inherit;
    outline: none;
  }
  #msg:focus { border-color: #2f6f4f; }
  #send {
    padding: 0 22px; border: none; border-radius: 12px; background: #2f6f4f;
    color: #fff; font-size: 15px; cursor: pointer;
  }
  #send:disabled { background: #b9c9bd; cursor: default; }

  .dots span {
    display: inline-block; width: 6px; height: 6px; margin-right: 4px;
    background: #b0b0a8; border-radius: 50%; animation: blink 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .25; } 30% { opacity: 1; } }
.bubble h1, .bubble h2, .bubble h3, .bubble h4 {
  font-size: 15px; font-weight: 600; margin: 14px 0 6px;
}
.bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child {
  margin-top: 0;
}
.bubble p { margin: 6px 0; }
.bubble ul, .bubble ol { margin: 6px 0; padding-left: 22px; }
.bubble li { margin: 3px 0; }
.bubble strong { font-weight: 600; }
.bubble code {
  background: #f2f2ee; padding: 1px 5px; border-radius: 4px;
  font-size: 13px; font-family: ui-monospace, Consolas, monospace;
}
.bubble pre {
  background: #f2f2ee; padding: 10px 12px; border-radius: 8px;
  overflow-x: auto; margin: 8px 0;
}
.bubble pre code { background: none; padding: 0; font-size: 12.5px; }
.bubble blockquote {
  border-left: 3px solid #cfd8d2; margin: 8px 0;
  padding: 2px 0 2px 10px; color: #555;
}
.bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13.5px; }
.bubble th, .bubble td { border: 1px solid #e2e2dc; padding: 5px 9px; }
.bubble th { background: #f6f6f2; font-weight: 600; }


</style>
</head>
<body>

<header>
    <h1>我的笔记助手</h1>
    <button onclick="newChat()">新对话</button>
</header>

<div id="log">
    <div class="row ai">
        <div class="bubble">你好。我能在你的学习笔记里检索，也能陪你聊。<br>试试问我：「RAG 是什么？」或者「我最近学了什么」。</div>
    </div>
</div>
<div id = "bar">
    <textarea id="msg" placeholder="问点什么....(Enter 发送，Shift+Enter 换行)"></textarea>
    <button id="send" onclick="send()">发送</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
let threadId = "t-" + Date.now()
const log = document.getElementById("log")
const box = document.getElementById("msg")
const btn = document.getElementById("send")

box.addEventListener("keydown",(e)=>{
    if (e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        send();
    }
});

function esc(s){
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
}


function addRow(who, html, meta){
    const row = document.createElement("div");
    row.className = "row " + who;
    const b = document.createElement("div");
    b.className = "bubble";
    b.innerHTML = html;
    if(meta){
        const m = document.createElement("div");
        m.className = "meta";
        m.innerHTML = meta;
        b.appendChild(m);
    }
    row.appendChild(b);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return b;
}

function newChat(){
  threadId = "t-" + Date.now();
  log.innerHTML = "";
  addRow("ai","新对话开始了。之前聊的内容我不会记得。");
}

async function send() {
  const text = box.value.trim();
  if (!text) return;

  addRow("user", esc(text));
  box.value = "";
  btn.disabled = true;

  // 气泡分三块：上面步骤、中间答案、下面来源
  const bubble = addRow("ai", "");
  bubble.innerHTML =
      '<div class="steps"></div>' +
      '<div class="answer"><span class="dots"><span></span><span></span><span></span></span></div>' +
      '<div class="meta"></div>';
  const stepsEl  = bubble.querySelector(".steps");
  const answerEl = bubble.querySelector(".answer");
  const metaEl   = bubble.querySelector(".meta");

  let full = "";
  let started = false;
  let metaInfo = null;
  let lastRender = 0;

  try {
    const res = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, thread_id: threadId })
    });
    if (!res.ok) {
      throw new Error("服务返回 " + res.status);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.trim()) continue;
        const msg = JSON.parse(line);

        if (msg.type === "step") {
          // 一条新步骤，加到步骤区
          const d = document.createElement("div");
          d.className = "step";
          d.textContent = msg.text;
          stepsEl.appendChild(d);
          log.scrollTop = log.scrollHeight;

        } else if (msg.type === "text") {
          if (!started) {
            started = true;
            answerEl.innerHTML = "";        // 抹掉三个点
          }
          full += msg.content;
          if (Date.now() - lastRender > 50) {
            answerEl.innerHTML = (typeof marked !== "undefined")
                ? marked.parse(full)
                : esc(full);
            lastRender = Date.now();
            log.scrollTop = log.scrollHeight;
          }

        } else if (msg.type === "meta") {
          metaInfo = msg;
        }
      }
    }

    // 收尾：补最后一次渲染
    answerEl.innerHTML = (typeof marked !== "undefined")
        ? marked.parse(full)
        : esc(full);
    if (!started) {
      answerEl.innerHTML = "（没有收到回答）";
    }

    if (metaInfo && metaInfo.sources && metaInfo.sources.length) {
      metaEl.innerHTML = '<span class="tag">查了笔记</span>' + metaInfo.sources.join("、");
    }

  } catch (err) {
    answerEl.innerHTML = "出错了：" + esc(err.message);
  } finally {
    btn.disabled = false;
    box.focus();
    log.scrollTop = log.scrollHeight;
  }
}
</script>
</body>
</html>
